# Copy to ~/.night-elves/config.toml (or ./config.toml) and edit.

[paths]
db = "~/.night-elves/queue.db"
results = "~/.night-elves/results"
work = "~/.night-elves/work"     # agent-tier workspaces, one folder per task
attachments = "~/.night-elves/attachments"  # files sent with a task, one folder per task

[budget]
monthly_credit_usd = 100.0   # Claude Max 5x API credit; expires at the end of each cycle
cycle_day = 1                # day of month your plan renews (1-28)
start_fraction = 0.5         # stay local-only until this share of the cycle has passed
endgame_days = 7             # in the last N days the frontier model also executes hard tasks
burst = 1.5                  # tonight's allowance = remaining / days_left * burst
per_night_cap_usd = 15.0     # hard ceiling per run
conserve_night_cap_usd = 2.0 # early-cycle ceiling (frontier-tier tasks and escalations only)
max_usd_per_task = 3.0       # API credit one task may use across all its calls; 0 = no limit

[limits]
max_attempts = 3             # then the task is marked failed
escalate_after = 2           # failed local attempts before the frontier model takes over
max_minutes = 360            # stop starting new tasks after this long
hard_priority = 3            # priority <= this counts as "hard": endgame tasks, Claude's agent
check_timeout = 600          # seconds an agent's CHECK command may run when night-elves re-runs it

[backends.local]
type = "openai_compat"
base_url = "http://localhost:11434/v1"   # Ollama; LM Studio is usually :1234/v1
model = "your-local-model"
max_tokens = 8192
timeout = 3600
# search_url = "http://127.0.0.1:8888"   # a SearXNG instance (JSON output on): tasks are then
# max_pages = 10                         # researched on the web in stages (README, Local web
# min_pages = 2                          # search); fewer useful pages than min_pages fails
# [backends.local.extra]                 # added to each request as it is, e.g. for gpt-oss:
# reasoning_effort = "high"

[backends.local_vision]                  # optional: a local model that can see images, used
type = "openai_compat"                    # for images and PDFs of up to 20 pages (as page
base_url = "http://localhost:1234/v1"     # images) when roles.local_vision names it
model = "your-vision-model"               # e.g. LM Studio's id for Qwen3.8-27B (MLX)
vision = true
max_tokens = 16384                        # thinking models spend part of this reasoning
timeout = 3600

[backends.claude_api]
type = "anthropic_api"
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"        # key from the Console org linked to your plan
max_tokens = 32000                       # thinking always counts against this; 8k ran dry
effort = "high"                          # low | medium (the model's default) | high | xhigh | max
server_tools = ["web_search", "web_fetch"]  # Anthropic-run tools; searches cost $0.01 each
max_tool_uses = 20                       # per tool, per request
timeout = 1800
# fallbacks = false                      # on by default: a declined request reruns on another model
# USD per million tokens, from the current pricing page; the pacing maths depends on them.
price_in = 4.0
price_out = 20.0

[backends.claude_cli]                     # Claude Code headless, on your subscription limits
type = "command"
argv = ["claude", "-p", "{prompt}"]
window = [1, 5]                           # local hours it may run: 01:00 up to 05:00
max_runs_per_night = 5
timeout = 1800
# env_unset = ["ANTHROPIC_API_KEY"]       # the default for command backends: keeps `claude -p` on
                                          # the subscription instead of billing the API key

[backends.claude_agent]                   # agent tier only: Claude Code that may run commands
type = "command"                          # prompt goes on stdin; cwd is ~/.night-elves/work/<id>
argv = ["claude", "-p", "--restricted", "--strict-mcp-config",
        "--tools", "Bash,Read,Edit,Write,Glob,Grep,WebFetch,WebSearch",
        "--settings", "~/.night-elves/agent-settings.json",   # copy of agent-settings.example.json
        "--permission-mode", "dontAsk", "--max-turns", "200", "--output-format", "json"]
output = "claude-json"                    # records its tokens and what they'd cost at API prices
session_args = ["--session-id", "{session}"]   # first run: a session id night-elves keeps
resume_args = ["--resume", "{session}"]        # later runs of the task continue that session
window = [1, 5]
max_runs_per_night = 3
timeout = 5400                            # then the whole process group is killed
# notes = "..."                           # added to the agent's instructions (see local_agent)

[backends.claude_agent.env]               # caches live in the workspace, the only writable place
UV_CACHE_DIR = "{cwd}/.cache/uv"
PIP_CACHE_DIR = "{cwd}/.cache/pip"
npm_config_cache = "{cwd}/.cache/npm"
CARGO_HOME = "{cwd}/.cache/cargo"
XDG_CACHE_HOME = "{cwd}/.cache"

[backends.local_agent]                    # agent tier, tried before Claude when roles.local_agent
type = "command"                          # names it: opencode driving a local model, inside
argv = ["srt", "--settings", "~/.night-elves/srt-settings.json", "--",  # Anthropic's sandbox
        "opencode", "run", "--standalone", "--auto", "--format", "json",  # runtime
        "-m", "lmstudio/qwen3.8-27b"]
output = "opencode-json"                  # records its token counts
session_args = ["--session", "ses_{session_hex}"]  # the same id creates, then continues, a session
max_runs_per_night = 10                   # no window: it runs any time, like the local model
timeout = 5400
notes = """Playwright 1.65.0 and its Chromium are installed on this Mac. Use exactly that \
version (npm i -D playwright@1.65.0): another would try to download a browser and fail. In this \
sandbox Chromium only starts as chromium.launch({ args: ['--single-process'] })."""

[backends.local_agent.env]                # opencode's config, sessions and caches
OPENCODE_CONFIG = "~/.night-elves/opencode.json"   # copy of opencode.example.json
XDG_CONFIG_HOME = "{cwd}/.cache/config"
XDG_DATA_HOME = "{cwd}/.cache/data"       # sessions live here, so a retry can continue one
XDG_STATE_HOME = "{cwd}/.cache/state"
XDG_CACHE_HOME = "{cwd}/.cache"
UV_CACHE_DIR = "{cwd}/.cache/uv"
PIP_CACHE_DIR = "{cwd}/.cache/pip"
npm_config_cache = "{cwd}/.cache/npm"
CARGO_HOME = "{cwd}/.cache/cargo"

[backends.codex]                         # ChatGPT plan via Codex CLI, as a second-opinion reviewer
type = "command"
enabled = false
argv = ["codex", "exec", "{prompt}"]
window = [1, 5]
max_runs_per_night = 3

[roles]
local = "local"
frontier_api = "claude_api"
frontier_sub = "claude_cli"
second_opinion = "codex"
agent = "claude_agent"
local_vision = ""            # "local_vision" to use the block above
local_review = ""            # reviews local answers when no other reviewer is free; "" = local itself
local_agent = ""             # "local_agent": agent tasks try it first (see Agent tier)
classifier = ""              # sizes up auto tasks as agent / web / answer; "" = local, "off"

[push]
owners = []                  # GitHub owners an agent may push to, e.g. ["your-user"]; [] = none

[web]
host = "127.0.0.1"           # keep on loopback; publish through Tailscale or a tunnel
port = 8377
token_env = "ELVES_TOKEN"
sms_allow = []               # e.g. ["+16125550123"]
max_upload_mb = 2048         # one task's files through the web intake
public_url = ""              # e.g. "https://studio.tailnet-name.ts.net": digests then link each result

[notify]
# Command that receives the morning digest. "{text}" is replaced with the digest;
# without it the digest is sent on stdin. Empty = just write the digest file.
argv = []
