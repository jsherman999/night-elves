<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" role="img" aria-label="How a written answer is produced, reviewed, retried and escalated" font-family="-apple-system,system-ui,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1d1d1f" color="#1d1d1f"><rect width="900" height="800" fill="#ffffff"/><defs><marker id="wf2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="160.0" y="13.0" width="280" height="42" rx="21.0" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:2"/><text font-weight="650" x="300" y="30.5" text-anchor="middle">A written-answer task</text><text font-size="11.5" opacity=".82" x="300" y="45.5" text-anchor="middle">tier auto, local or frontier</text><polygon points="300,83.0 425.0,128 300,173.0 175.0,128" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:1.4"/><text font-weight="650" x="300" y="124.5" text-anchor="middle">Frontier tier, or</text><text font-size="11.5" opacity=".82" x="300" y="139.5" text-anchor="middle">needs the web?</text><rect x="550.0" y="96.0" width="300" height="64" rx="9" style="fill:#fff4cc;stroke:#8a6d00;stroke-width:1.4"/><text font-weight="650" x="700" y="117.0" text-anchor="middle">Claude answers, and can search the web</text><text font-size="11.5" opacity=".82" x="700" y="132.0" text-anchor="middle">claude_api (claude-opus-5-5)</text><text font-size="11.5" opacity=".82" x="700" y="147.0" text-anchor="middle">claude_cli when the API allowance is gone</text><polygon points="300,205.0 425.0,250 300,295.0 175.0,250" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:1.4"/><text font-weight="650" x="300" y="246.5" text-anchor="middle">Images or PDFs</text><text font-size="11.5" opacity=".82" x="300" y="261.5" text-anchor="middle">attached?</text><rect x="550.0" y="224.0" width="300" height="52" rx="9" style="fill:#dcf3e3;stroke:#1d7a3a;stroke-width:1.4"/><text font-weight="650" x="700" y="246.5" text-anchor="middle">A local vision model reads them</text><text font-size="11.5" opacity=".82" x="700" y="261.5" text-anchor="middle">local_vision (qwen3.8-27b)</text><rect x="150.0" y="340.0" width="300" height="52" rx="9" style="fill:#dcf3e3;stroke:#1d7a3a;stroke-width:1.4"/><text font-weight="650" x="300" y="362.5" text-anchor="middle">The local model answers</text><text font-size="11.5" opacity=".82" x="300" y="377.5" text-anchor="middle">local (gpt-oss-120b)</text><rect x="150.0" y="430.0" width="300" height="52" rx="9" style="fill:#dde9ff;stroke:#1f5fbf;stroke-width:1.4"/><text font-weight="650" x="300" y="452.5" text-anchor="middle">A reviewer checks the answer</text><text font-size="11.5" opacity=".82" x="300" y="467.5" text-anchor="middle">codex; local_vision if it can&#x27;t</text><polygon points="300,512.0 400.0,552 300,592.0 200.0,552" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:1.4"/><text font-weight="650" x="300" y="556.0" text-anchor="middle">PASS?</text><rect x="580.0" y="529.0" width="240" height="46" rx="23.0" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:2"/><text font-weight="650" x="700" y="548.5" text-anchor="middle">Done</text><text font-size="11.5" opacity=".82" x="700" y="563.5" text-anchor="middle">saved; in the morning digest</text><polygon points="300,625.0 415.0,668 300,711.0 185.0,668" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:1.4"/><text font-weight="650" x="300" y="664.5" text-anchor="middle">Rejected</text><text font-size="11.5" opacity=".82" x="300" y="679.5" text-anchor="middle">twice?</text><rect x="550.0" y="642.0" width="300" height="52" rx="9" style="fill:#fff4cc;stroke:#8a6d00;stroke-width:1.4"/><text font-weight="650" x="700" y="664.5" text-anchor="middle">Claude takes the task over</text><text font-size="11.5" opacity=".82" x="700" y="679.5" text-anchor="middle">claude_api (claude-opus-5-5)</text><rect x="580.0" y="739.0" width="240" height="46" rx="9" style="fill:#fde2df;stroke:#b3261e;stroke-width:1.4"/><text font-weight="650" x="700" y="758.5" text-anchor="middle">Failed</text><text font-size="11.5" opacity=".82" x="700" y="773.5" text-anchor="middle">after 3 failed attempts</text><path d="M300,55 L300,82" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf2-a)"/><path d="M425,128 L549,128" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf2-a)"/><text font-size="11.5" font-style="italic" x="433" y="120" text-anchor="start">yes</text><path d="M300,173 L300,204" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf2-a)"/><text font-size="11.5" font-style="italic" x="308" y="193" text-anchor="start">no</text><path d="M425,250 L549,250" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf2-a)"/><text font-size="11.5" font-style="italic" x="433" y="242" text-anchor="start">yes</text><path d="M300,295 L300,339" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf2-a)"/><text font-size="11.5" font-style="italic" x="308" y="318" text-anchor="start">no</text><path d="M300,392 L300,429" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf2-a)"/><path d="M300,482 L300,511" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf2-a)"/><path d="M400,552 L579,552" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf2-a)"/><text font-size="11.5" font-style="italic" x="408" y="544" text-anchor="start">yes</text><path d="M300,592 L300,624" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf2-a)"/><text font-size="11.5" font-style="italic" x="308" y="612" text-anchor="start">no</text><path d="M185,668 L60,668 L60,366 L149,366" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf2-a)"/><text font-size="11.5" font-style="italic" x="176" y="660" text-anchor="end">no</text><text font-size="11.5" font-style="italic" x="68" y="500" text-anchor="start">again, with</text><text font-size="11.5" font-style="italic" x="68" y="515" text-anchor="start">the feedback</text><path d="M415,668 L549,668" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf2-a)"/><text font-size="11.5" font-style="italic" x="423" y="660" text-anchor="start">yes</text><path d="M700,642 L700,576" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf2-a)"/><text font-size="11.5" font-style="italic" x="708" y="612" text-anchor="start">its answer is kept</text><path d="M700,694 L700,738" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf2-a)"/><text font-size="11.5" font-style="italic" x="708" y="720" text-anchor="start">if that fails too</text><path d="M850,128 L880,128 L880,552 L821,552" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf2-a)"/><text font-size="11.5" font-style="italic" x="874" y="400" text-anchor="end">not reviewed</text><path d="M850,250 L880,250" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
