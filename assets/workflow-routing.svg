<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="How a queued task reaches the written-answer path or the agent path" font-family="-apple-system,system-ui,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1d1d1f" color="#1d1d1f"><rect width="900" height="470" fill="#ffffff"/><defs><marker id="wf1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="290.0" y="12.0" width="320" height="44" rx="22.0" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:2"/><text font-weight="650" x="450" y="30.5" text-anchor="middle">A task is queued</text><text font-size="11.5" opacity=".82" x="450" y="45.5" text-anchor="middle">from the CLI, the web page, a phone or SMS</text><rect x="250.0" y="92.0" width="400" height="48" rx="9" style="fill:#ffffff;stroke:#8d897f;stroke-width:1.4"/><text font-weight="650" x="450" y="112.5" text-anchor="middle">A run picks it up</text><text font-size="11.5" opacity=".82" x="450" y="127.5" text-anchor="middle">nightly, or within a minute of a scheduled time</text><polygon points="450,170.0 560.0,212 450,254.0 340.0,212" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:1.4"/><text font-weight="650" x="450" y="208.5" text-anchor="middle">Which tier</text><text font-size="11.5" opacity=".82" x="450" y="223.5" text-anchor="middle">was chosen?</text><rect x="290.0" y="300.0" width="320" height="52" rx="9" style="fill:#dcf3e3;stroke:#1d7a3a;stroke-width:1.4"/><text font-weight="650" x="450" y="322.5" text-anchor="middle">It is sized up, once</text><text font-size="11.5" opacity=".82" x="450" y="337.5" text-anchor="middle">local sorts it: tools, web or answer</text><rect x="20.0" y="405.0" width="300" height="50" rx="25.0" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:2"/><text font-weight="650" x="170" y="426.5" text-anchor="middle">Written-answer path</text><text font-size="11.5" opacity=".82" x="170" y="441.5" text-anchor="middle">figure 2</text><rect x="580.0" y="405.0" width="300" height="50" rx="25.0" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:2"/><text font-weight="650" x="730" y="426.5" text-anchor="middle">Agent path</text><text font-size="11.5" opacity=".82" x="730" y="441.5" text-anchor="middle">figure 3</text><path d="M450,56 L450,91" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf1-a)"/><path d="M450,140 L450,169" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf1-a)"/><path d="M450,254 L450,299" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf1-a)"/><text font-size="11.5" font-style="italic" x="458" y="280" text-anchor="start">auto</text><path d="M340,212 L100,212 L100,404" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf1-a)"/><text font-size="11.5" font-style="italic" x="330" y="204" text-anchor="end">local or frontier</text><path d="M560,212 L800,212 L800,404" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf1-a)"/><text font-size="11.5" font-style="italic" x="570" y="204" text-anchor="start">agent</text><path d="M400,352 L400,380 L240,380 L240,404" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf1-a)"/><text font-size="11.5" font-style="italic" x="392" y="373" text-anchor="end">web or answer</text><path d="M500,352 L500,380 L660,380 L660,404" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf1-a)"/><text font-size="11.5" font-style="italic" x="508" y="373" text-anchor="start">needs tools</text></svg>
