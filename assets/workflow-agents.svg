<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1010" width="920" height="1010" role="img" aria-label="How an agent task is worked, checked, reviewed, retried and escalated" font-family="-apple-system,system-ui,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1d1d1f" color="#1d1d1f"><rect width="920" height="1010" fill="#ffffff"/><defs><marker id="wf3-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="290.0" y="12.0" width="320" height="44" rx="22.0" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:2"/><text font-weight="650" x="450" y="30.5" text-anchor="middle">An agent task</text><text font-size="11.5" opacity=".82" x="450" y="45.5" text-anchor="middle">work that needs tools, in its own workspace</text><polygon points="450,86.0 580.0,132 450,178.0 320.0,132" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:1.4"/><text font-weight="650" x="450" y="128.5" text-anchor="middle">Priority 1-3, or</text><text font-size="11.5" opacity=".82" x="450" y="143.5" text-anchor="middle">2 failed attempts?</text><rect x="645.0" y="100.0" width="260" height="64" rx="9" style="fill:#dde9ff;stroke:#1f5fbf;stroke-width:1.4"/><text font-weight="650" x="775" y="121.0" text-anchor="middle">Claude&#x27;s agent works on it</text><text font-size="11.5" opacity=".82" x="775" y="136.0" text-anchor="middle">claude_agent (Claude Code)</text><text font-size="11.5" opacity=".82" x="775" y="151.0" text-anchor="middle">01:00-07:00, 3 runs a night</text><rect x="310.0" y="219.0" width="280" height="58" rx="9" style="fill:#dcf3e3;stroke:#1d7a3a;stroke-width:1.4"/><text font-weight="650" x="450" y="237.0" text-anchor="middle">The local agent works on it</text><text font-size="11.5" opacity=".82" x="450" y="252.0" text-anchor="middle">local_agent (qwen3.8-27b)</text><text font-size="11.5" opacity=".82" x="450" y="267.0" text-anchor="middle">10 runs a night</text><polygon points="450,323.0 575.0,368 450,413.0 325.0,368" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:1.4"/><text font-weight="650" x="450" y="364.5" text-anchor="middle">How did the</text><text font-size="11.5" opacity=".82" x="450" y="379.5" text-anchor="middle">run end?</text><rect x="15.0" y="330.0" width="250" height="76" rx="9" style="fill:#dde9ff;stroke:#1f5fbf;stroke-width:1.4"/><text font-weight="650" x="140" y="357.0" text-anchor="middle">It ran out of time</text><text font-size="11.5" opacity=".82" x="140" y="372.0" text-anchor="middle">codex leaves a handoff note;</text><text font-size="11.5" opacity=".82" x="140" y="387.0" text-anchor="middle">the next run continues the session</text><rect x="645.0" y="330.0" width="260" height="76" rx="9" style="fill:#fde2df;stroke:#b3261e;stroke-width:1.4"/><text font-weight="650" x="775" y="357.0" text-anchor="middle">It crashed, or the backend is down</text><text font-size="11.5" opacity=".82" x="775" y="372.0" text-anchor="middle">one attempt lost; it waits for the</text><text font-size="11.5" opacity=".82" x="775" y="387.0" text-anchor="middle">next run. 3 errors rest a backend</text><polygon points="450,441.0 575.0,484 450,527.0 325.0,484" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:1.4"/><text font-weight="650" x="450" y="480.5" text-anchor="middle">Did it end with</text><text font-size="11.5" opacity=".82" x="450" y="495.5" text-anchor="middle">STATUS: DONE?</text><rect x="310.0" y="562.0" width="280" height="52" rx="9" style="fill:#ffffff;stroke:#8d897f;stroke-width:1.4"/><text font-weight="650" x="450" y="584.5" text-anchor="middle">night-elves runs its CHECK command</text><text font-size="11.5" opacity=".82" x="450" y="599.5" text-anchor="middle">in a sandbox with no network</text><polygon points="450,644.0 560.0,684 450,724.0 340.0,684" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:1.4"/><text font-weight="650" x="450" y="688.0" text-anchor="middle">Did it exit 0?</text><rect x="310.0" y="756.0" width="280" height="52" rx="9" style="fill:#dde9ff;stroke:#1f5fbf;stroke-width:1.4"/><text font-weight="650" x="450" y="778.5" text-anchor="middle">codex reads the workspace</text><text font-size="11.5" opacity=".82" x="450" y="793.5" text-anchor="middle">the local agent&#x27;s work only</text><polygon points="450,838.0 560.0,878 450,918.0 340.0,878" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:1.4"/><text font-weight="650" x="450" y="882.0" text-anchor="middle">PASS?</text><rect x="285.0" y="951.0" width="330" height="50" rx="25.0" style="fill:#ffffff;stroke:#1d1d1f;stroke-width:2"/><text font-weight="650" x="450" y="972.5" text-anchor="middle">Done</text><text font-size="11.5" opacity=".82" x="450" y="987.5" text-anchor="middle">workspace committed; pushed to GitHub if asked</text><rect x="645.0" y="646.0" width="260" height="76" rx="9" style="fill:#fde2df;stroke:#b3261e;stroke-width:1.4"/><text font-weight="650" x="775" y="673.0" text-anchor="middle">A failed attempt</text><text font-size="11.5" opacity=".82" x="775" y="688.0" text-anchor="middle">the reason goes back to the agent,</text><text font-size="11.5" opacity=".82" x="775" y="703.0" text-anchor="middle">which carries on in its session</text><rect x="665.0" y="951.0" width="220" height="50" rx="9" style="fill:#fde2df;stroke:#b3261e;stroke-width:1.4"/><text font-weight="650" x="775" y="972.5" text-anchor="middle">Failed</text><text font-size="11.5" opacity=".82" x="775" y="987.5" text-anchor="middle">after 3 failed attempts</text><path d="M450,56 L450,85" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><path d="M580,132 L644,132" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><text font-size="11.5" font-style="italic" x="586" y="124" text-anchor="start">yes</text><path d="M450,178 L450,218" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><text font-size="11.5" font-style="italic" x="458" y="204" text-anchor="start">no</text><path d="M450,277 L450,322" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><path d="M775,164 L775,300 L450,300" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M325,368 L266,368" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><path d="M140,330 L140,132 L319,132" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><text font-size="11.5" font-style="italic" x="148" y="236" text-anchor="start">not a failed attempt</text><text font-size="11.5" font-style="italic" x="148" y="251" text-anchor="start">(4 time-outs fail it)</text><path d="M575,368 L644,368" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><text font-size="11.5" font-style="italic" x="581" y="360" text-anchor="start">error</text><path d="M450,413 L450,440" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><text font-size="11.5" font-style="italic" x="458" y="432" text-anchor="start">it replied</text><path d="M450,527 L450,561" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><text font-size="11.5" font-style="italic" x="458" y="549" text-anchor="start">yes</text><path d="M450,614 L450,643" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><path d="M450,724 L450,755" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><text font-size="11.5" font-style="italic" x="458" y="744" text-anchor="start">yes</text><path d="M450,808 L450,837" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><path d="M450,918 L450,950" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><text font-size="11.5" font-style="italic" x="458" y="938" text-anchor="start">yes</text><path d="M575,484 L775,484 L775,645" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><text font-size="11.5" font-style="italic" x="583" y="476" text-anchor="start">no, or no STATUS line</text><path d="M560,684 L644,684" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><text font-size="11.5" font-style="italic" x="568" y="676" text-anchor="start">no</text><path d="M560,878 L720,878 L720,723" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><text font-size="11.5" font-style="italic" x="568" y="870" text-anchor="start">FAIL</text><path d="M830,722 L830,950" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#wf3-a)"/><text font-size="11.5" font-style="italic" x="838" y="840" text-anchor="start">the 3rd time</text><path d="M905,684 L912,684 L912,70 L450,70" fill="none" stroke="currentColor" stroke-width="1.4"/><text font-size="11.5" font-style="italic" x="906" y="60" text-anchor="end">tries again</text></svg>
